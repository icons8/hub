name: Feature request
description: Propose something the hub should do
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The core takes only what every hub needs; a feature that suits one person's taste, services or machine is a module or
        a plugin in your own repository (see EXTENDING.md). If the Plugin API lacks something you need, say so here: that
        gap is the best kind of core improvement.

        Open-ended ideas and questions go to Discussions. Pull requests from outside the maintainers' group are not
        accepted for now (see CONTRIBUTING.md); a clear proposal is the most useful contribution.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the hub to do?
      description: What you would see on the page, in Telegram or in the `hub` command.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: Could a module, a page plugin or a skill do it today? What is missing for that?
  - type: dropdown
    id: scope
    attributes:
      label: Who needs it?
      options:
        - Every hub
        - Those who turn it on
        - Mostly me
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues for the same request.
          required: true
